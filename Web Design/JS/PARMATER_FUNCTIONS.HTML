<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function prime(n){
            let i;
            let count = 0;
            for (i=1;i<=n;i++){
                if (n%i == 0){
                    count++
                }
            }
            if (count == 2){
                console.log("prime number")
            }
            
            else{
                console.log("not a prime number")
            }
        }
        prime(6)
    </script>
</body>
</html>

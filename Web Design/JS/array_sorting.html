<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr = [2,3,1,5,4];
        let sum = 0;
        console.log(`unsorted array:${arr}`)

        for (let i=0;i<arr.length;i++){
            for (let j=i;j<arr.length;j++){
                if(arr[i]>arr[j]){
                    let temp;
                    temp = arr[i];
                    arr[i] = arr[j];
                    arr[j] = temp;                     
                }
            }
        }
        document.write(`sorted array:${arr}`)
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="h1" onmouseover="mouse_over()" onmouseout="mouse_out()">Welcome!!</h1>
    <script>
        function mouse_over(){
            document.getElementById("h1").innerHTML += "Dennis" 
        }
        
        function mouse_out(){
            document.getElementById("h1").innerHTML = "Welcome!!" 
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissions Dashboard | Swan Solution</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Swan Hotel Management</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Guest Registration</a>
                <a class="nav-link active" href="view.html">View Submissions</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-md-5 mb-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white p-3 d-flex flex-wrap justify-content-between align-items-center gap-3">
                <h4 class="mb-0">Logged Guest Submissions Database</h4>
                
                <div class="d-flex gap-2 min-vw-25">
                    <input type="text" id="dashboardSearch" class="form-control form-control-sm" placeholder="Search by name or date (YYYY-MM-DD)...">
                </div>
            </div>
            <div class="card-body p-0">
                
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0" id="submissionsTable">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Aadhar Card</th>
                                <th>Check-In</th>
                                <th>Check-Out</th>
                                <th>Adults</th>
                                <th>Address</th>
                                <th>Purpose</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="submissionTableBody">
                            </tbody>
                    </table>
                </div>

                <div id="noDataAlert" class="text-center py-5 d-none">
                    <h5 class="text-muted mb-0">No records found matching criteria matching constraints [cite: 37]</h5>
                </div>

            </div>
        </div>
    </div>

    <script type="module">
        import { SubmissionViewer } from './app.js';
        document.addEventListener('DOMContentLoaded', () => {
            new SubmissionViewer();
        });
    </script>
</body>
</html>

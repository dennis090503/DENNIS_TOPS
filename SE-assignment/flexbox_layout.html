<!DOCTYPE html>
<html>
<head>
<style>
body{
margin:0;
display:flex;
flex-direction:column;
height:100vh;
}

.container{
display:flex;
flex:1;
}

.sidebar{
width:200px;
background:lightgray;
}

.main{
flex:1;
background:white;
}

header,footer{
background:black;
color:white;
padding:20px;
}

@media(max-width:768px){
.container{
flex-direction:column;
}
}
</style>
</head>
<body>

<header>Header</header>

<div class="container">
<div class="sidebar">Sidebar</div>
<div class="main">Main Content</div>
</div>

<footer>Footer</footer>

</body>
</html>
